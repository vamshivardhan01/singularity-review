name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  # write, not read: the action posts an explanatory comment back to the PR
  # when the title is invalid -- read-only produced a real "Resource not
  # accessible by integration" failure the first time this ran for real,
  # confirmed against the actual job log, not assumed from the action's docs.
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional Commits: <type>(<optional scope>): <description>
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The description (after "type:") must not start with an uppercase letter.
          wip: true
